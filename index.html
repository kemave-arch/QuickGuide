              {/* Sensor Component Renderers with Clear Vertical Distance from Title */}
              {appKey === 'app1' && (
                <g id="sensor-1ch">
                  <rect x="170" y="70" width="140" height="80" rx="6" fill="#f8fafc" stroke="#64748b" strokeWidth="1.5" />
                  <text x="240" y="88" fill="#0f172a" fontSize="11" fontWeight="bold" textAnchor="middle" fontFamily="Inter">1-Channel Sensor (1NC)</text>
                  
                  {/* Standard IEC 1NC Contact Symbol */}
                  <path d="M 195 125 L 210 125" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" />
                  <path d="M 210 125 L 252 108" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" />
                  <path d="M 244 100 L 244 125 L 265 125" fill="none" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                </g>
              )}

              {(appKey === 'app2' || appKey === 'app31' || appKey === 'app32') && (
                <g id="sensor-2ch">
                  <rect x="165" y="60" width="150" height="125" rx="6" fill="#f8fafc" stroke="#64748b" strokeWidth="1.5" />
                  <text x="240" y="78" fill="#0f172a" fontSize="10.5" fontWeight="bold" textAnchor="middle" fontFamily="Inter">
                    {appKey === 'app32' ? 'Non-Equivalent (1NO+1NC)' : '2-Channel Sensor (2NC)'}
                  </text>

                  {/* CH1 1NC Contact */}
                  <path d="M 195 110 L 210 110" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" />
                  <path d="M 210 110 L 252 93" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" />
                  <path d="M 244 85 L 244 110 L 265 110" fill="none" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />

                  {/* CH2 Contact */}
                  {appKey === 'app32' ? (
                    <g>
                      {/* CH2 1NO Contact */}
                      <path d="M 195 150 L 210 150" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" />
                      <path d="M 210 150 L 240 136" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" />
                      <path d="M 244 138 L 244 150 L 265 150" fill="none" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                    </g>
                  ) : (
                    <g>
                      {/* CH2 1NC Contact */}
                      <path d="M 195 150 L 210 150" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" />
                      <path d="M 210 150 L 252 133" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" />
                      <path d="M 244 125 L 244 150 L 265 150" fill="none" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                    </g>
                  )}

                  {/* Mechanical Linkage (Dashed vertical line) */}
                  <line x1="228" y1="102" x2="228" y2="142" stroke="#64748b" strokeWidth="1.5" strokeDasharray="3,3" />
                </g>
              )}

              {appKey === 'appMat' && (
                <g id="safety-mat">
                  <rect x="160" y="75" width="160" height="95" rx="8" fill="#f8fafc" stroke="#00a8cc" strokeWidth="2" />
                  <text x="240" y="95" fill="#0f172a" fontSize="11.5" fontWeight="bold" textAnchor="middle" fontFamily="Inter">4-Wire Safety Mat</text>
                  <text x="240" y="112" fill="#64748b" fontSize="9.5" textAnchor="middle" fontFamily="Inter">NO Operating Principle</text>
                  <line x1="190" y1="135" x2="290" y2="135" stroke="#0f172a" strokeWidth="2.5" strokeDasharray="6,4" />
                </g>
              )}

              {/* LAYER 3: Grouped Wire Paths */}
              <g id="fdi-wire-paths">
                {wireList.map((wire, idx) => {
                  const pathD = pointsToSvgPath(wire.points);
                  return (
                    <g key={idx}>
                      <path d={pathD} fill="none" stroke={wire.color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                      {animate && (
                        <path 
                          d={pathD} 
                          fill="none" 
                          stroke="#ffffff" 
                          strokeWidth="1.8" 
                          strokeLinecap="round" 
                          strokeLinejoin="round" 
                          className={wire.isPulse ? "animated-wire-pulse" : "animated-wire-dc"} 
                        />
                      )}
                    </g>
                  );
                })}
              </g>

              {/* LAYER 4: Terminal Dots & Pin Circles */}
              <g id="fdi-terminal-pins">
                <circle cx="435" cy="75" r="5.5" fill="#00a8cc" />
                <text x="447" y="79" fill="#0f172a" fontSize="11" fontWeight="bold" fontFamily="JetBrains Mono">1 : DI 0</text>

                <circle cx="435" cy="120" r="5.5" fill="#00a8cc" />
                <text x="447" y="124" fill="#0f172a" fontSize="11" fontWeight="bold" fontFamily="JetBrains Mono">5 : DI 4</text>

                <circle cx="435" cy="170" r="5.5" fill="#d97706" />
                <text x="447" y="174" fill="#0f172a" fontSize="11" fontWeight="bold" fontFamily="JetBrains Mono">9 : VS 0</text>

                <circle cx="435" cy="215" r="5.5" fill="#d97706" />
                <text x="447" y="219" fill="#0f172a" fontSize="11" fontWeight="bold" fontFamily="JetBrains Mono">13 : VS 4</text>

                {isExt && <circle cx="125" cy="49" r="4" fill="#dc2626" />}

                {appKey === 'app1' && (
                  <g>
                    <circle cx="195" cy="125" r="4" fill={!isExt ? "#d97706" : "#dc2626"} />
                    <circle cx="265" cy="125" r="4" fill="#00a8cc" />
                  </g>
                )}

                {(appKey === 'app2' || appKey === 'app31' || appKey === 'app32') && (
                  <g>
                    <circle cx="195" cy="110" r="4" fill={!isExt || appKey === 'app31' ? "#d97706" : "#dc2626"} />
                    <circle cx="265" cy="110" r="4" fill="#00a8cc" />
                    <circle cx="195" cy="150" r="4" fill={!isExt ? "#d97706" : "#dc2626"} />
                    <circle cx="265" cy="150" r="4" fill="#00a8cc" />
                  </g>
                )}

                {appKey === 'appMat' && (
                  <g>
                    <circle cx="175" cy="135" r="4" fill="#d97706" />
                    <circle cx="175" cy="155" r="4" fill="#d97706" />
                    <circle cx="305" cy="135" r="4" fill="#00a8cc" />
                    <circle cx="305" cy="155" r="4" fill="#00a8cc" />
                  </g>
                )}
              </g>

            </g>
          </svg>
        </div>
      );
    };

    // HIGH-PRECISION NON-OVERLAPPING SCHEMATIC & FAULT VISUALIZER FOR SIMULATION MODAL
    const SimulationChannelDiagram = ({ appKey, modalSupplyMode, fault, step, sctEnabled }) => {
      const is1oo1 = appKey === 'app1';
      const isMat = appKey === 'appMat';
      const isExt = modalSupplyMode === 'external';

      const fType = fault.faultType || 'short_Lplus';

      let ch1Color = "#16a34a"; // Green
      let ch2Color = "#16a34a";
      let diagLed = "#16a34a";
      let faultHighlight = step >= 2;
      let passivated = step === 4;

      if (step === 2) {
        ch1Color = "#dc2626";
      } else if (step === 3) {
        ch1Color = "#d97706";
        ch2Color = "#d97706";
        diagLed = "#d97706";
      } else if (step === 4) {
        ch1Color = "#94a3b8";
        ch2Color = "#94a3b8";
        diagLed = "#dc2626";
      }

      // Check if pulse animation should run on VSn/DI wires
      const isPulsing = sctEnabled && !isExt;

      return (
        <div className="w-full bg-[#121418] rounded-xl p-2.5 sm:p-3 border border-slate-700 select-none">
          <div className="flex justify-between items-center text-xs font-mono mb-1.5 text-slate-300">
            <span className="font-bold text-ak-cyan">
              // LIVE PLC SCHEMATIC SCHEME ({is1oo1 ? '1oo1 EVAL' : '1oo2 EVAL'} | {isExt ? 'EXT 24V' : 'VSn INT'} | SCT: {sctEnabled ? 'ON' : 'OFF'})
            </span>
            <span className="text-emerald-400 font-bold">
              {step === 1 ? '● 24V POWER OK' : step === 2 ? '⚡ FAULT INJECTED' : step === 3 ? '⏱ DIAGNOSTIC SCAN' : '🚫 PASSIVATED (0V)'}
            </span>
          </div>

          <svg viewBox="0 0 720 185" className="w-full h-auto">
            <rect width="720" height="185" fill="#1a1d24" rx="6" />

            {/* BUS POWER RAILS (L+ and M) WITH INCREASED CLEARANCE */}
            <line x1="20" y1="12" x2="700" y2="12" stroke="#dc2626" strokeWidth="2" />
            <text x="25" y="21" fill="#ef4444" fontSize="8" fontWeight="bold" fontFamily="JetBrains Mono">L+ (+24V DC BUS)</text>

            <line x1="20" y1="172" x2="700" y2="172" stroke="#00a8cc" strokeWidth="2" />
            <text x="25" y="167" fill="#00a8cc" fontSize="8" fontWeight="bold" fontFamily="JetBrains Mono">M (0V RETURN / GND BUS)</text>

            {/* Field Device Box - HEIGHTENED (height=124, y=26) & CLEAR TITLE CLEARANCE (y=39) */}
            <rect x="20" y="26" width="150" height="124" rx="5" fill="#1e293b" stroke="#64748b" strokeWidth="1.5" />
            <text x="95" y="39" fill="#ffffff" fontSize="9" fontWeight="bold" textAnchor="middle">
              {isMat ? '4-Wire Safety Mat' : is1oo1 ? '1-Channel Switch' : appKey === 'app32' ? 'Non-Eq Switch (1NO+1NC)' : '2-Channel Switch'}
            </text>

            {/* Power Supply Input Wire into Switch (ENTERS AT BOTTOM-LEFT x:35, y:138) */}
            {isExt ? (
              <g id="ext-supply-wire-group">
                <path d="M 35 12 L 35 138" fill="none" stroke="#dc2626" strokeWidth="2.5" />
                <circle cx="35" cy="12" r="3.5" fill="#dc2626" /> {/* L+ Bus terminal node */}
                <circle cx="35" cy="138" r="3.5" fill="#dc2626" /> {/* Switch power node at bottom-left */}
              </g>
            ) : (
              <g id="vsn-supply-wire-group">
                <path d="M 450 130 L 370 130 L 370 152 L 35 152 L 35 138" fill="none" stroke="#d97706" strokeWidth="2.5" />
                <circle cx="450" cy="130" r="3.5" fill="#d97706" /> {/* VS0 module terminal node */}
                <circle cx="35" cy="138" r="3.5" fill="#d97706" /> {/* Switch power node at bottom-left */}
              </g>
            )}

            {/* DYNAMIC IEC NC SWITCH CONTACTS (POWER BUS FEEDS UPWARDS FROM x:35, y:138) */}
            {is1oo1 ? (
              <g>
                {/* 1NC Internal Power Feeder from Bottom-Left (35,138) to Contact Base (35,90) */}
                <path d="M 35 138 L 35 90 L 65 90" fill="none" stroke="#94a3b8" strokeWidth="2" />
                
                {/* 1NC Blade */}
                <line 
                  x1="65" 
                  y1="90" 
                  x2={fType === 'wire_break' && step >= 2 ? "95" : "107"} 
                  y2={fType === 'wire_break' && step >= 2 ? "58" : "68"} 
                  stroke={fType === 'discrepancy' && step >= 2 ? "#dc2626" : "#94a3b8"} 
                  strokeWidth="2.5" 
                  strokeLinecap="round"
                />

                {/* 1NC Terminal Post & Outgoing Lead */}
                <path d="M 98 68 L 98 90 L 135 90" fill="none" stroke="#94a3b8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />

                {/* Welded Indicator Badge (Positioned at x=58..114, y=78..91 in open center space) */}
                {fType === 'discrepancy' && step >= 2 && (
                  <g>
                    <circle cx="86" cy="85" r="7" fill="none" stroke="#dc2626" strokeWidth="1.5" className="animate-ping" style={{ transformOrigin: 'center', transformBox: 'fill-box' }} />
                    <rect x="58" y="78" width="56" height="13" rx="2" fill="#dc2626" />
                    <text x="86" y="87" fill="#ffffff" fontSize="7" fontWeight="bold" textAnchor="middle">WELDED (1)</text>
                  </g>
                )}
                <circle cx="135" cy="90" r="3.5" fill={isExt ? "#dc2626" : "#d97706"} />
                {/* REPOSITIONED CH1 TEXT LABEL NEAR RIGHT INSIDE EDGE (x=165) */}
                <text x="165" y="82" fill="#94a3b8" fontSize="8" fontWeight="bold" textAnchor="end">CH1</text>
              </g>
            ) : (
              <g>
                {/* 2NC Internal Power Feeder from Bottom-Left (35,138) up to CH1 (35,73) and CH2 (35,108) */}
                <path d="M 35 138 L 35 73 L 65 73" fill="none" stroke="#94a3b8" strokeWidth="2" />
                <path d="M 35 108 L 65 108" fill="none" stroke="#94a3b8" strokeWidth="2" />

                {/* CH1 1NC Contact Blade (Top post at y=51, a full 12px below title at y=39) */}
                <line 
                  x1="65" 
                  y1="73" 
                  x2={fType === 'wire_break' && step >= 2 ? "92" : "107"} 
                  y2={fType === 'wire_break' && step >= 2 ? "48" : "56"} 
                  stroke={fType === 'discrepancy' && step >= 2 ? "#dc2626" : "#94a3b8"} 
                  strokeWidth="2.5" 
                  strokeLinecap="round"
                />

                {/* CH1 1NC Terminal Post & Outgoing Lead */}
                <path d="M 98 51 L 98 73 L 135 73" fill="none" stroke="#94a3b8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />

                {/* Welded/Stuck Contact Indicator for Discrepancy (Positioned at x=58..114, y=78..91 in open space between CH1 & CH2) */}
                {fType === 'discrepancy' && step >= 2 && (
                  <g>
                    <circle cx="86" cy="85" r="7" fill="none" stroke="#dc2626" strokeWidth="1.5" className="animate-ping" style={{ transformOrigin: 'center', transformBox: 'fill-box' }} />
                    <rect x="58" y="78" width="56" height="13" rx="2" fill="#dc2626" />
                    <text x="86" y="87" fill="#ffffff" fontSize="7" fontWeight="bold" textAnchor="middle">WELDED (1)</text>
                  </g>
                )}
                <circle cx="135" cy="73" r="3.5" fill={isExt ? "#dc2626" : "#d97706"} />
                {/* REPOSITIONED CH1 TEXT LABEL NEAR RIGHT INSIDE EDGE (x=165) */}
                <text x="165" y="65" fill="#94a3b8" fontSize="8" fontWeight="bold" textAnchor="end">CH1</text>

                {/* CH2 Contact */}
                {appKey === 'app32' ? (
                  /* CH2 1NO Contact for Non-Equivalent */
                  <g>
                    <line 
                      x1="65" 
                      y1="108" 
                      x2="95" 
                      y2="95" 
                      stroke="#94a3b8" 
                      strokeWidth="2.5" 
                      strokeLinecap="round"
                    />
                    <path d="M 98 96 L 98 108 L 135 108" fill="none" stroke="#94a3b8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                  </g>
                ) : (
                  /* CH2 1NC Contact for Equivalent */
                  <g>
                    <line 
                      x1="65" 
                      y1="108" 
                      x2={fType === 'discrepancy' && step >= 2 ? "90" : "107"} 
                      y2={fType === 'discrepancy' && step >= 2 ? "123" : "91"} 
                      stroke="#94a3b8" 
                      strokeWidth="2.5" 
                      strokeLinecap="round"
                    />
                    <path d="M 98 86 L 98 108 L 135 108" fill="none" stroke="#94a3b8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                    {/* OPEN (0) Indicator Badge for Discrepancy (Positioned at x=58..108, y=118..131 below CH2) */}
                    {fType === 'discrepancy' && step >= 2 && (
                      <g>
                        <rect x="58" y="118" width="50" height="13" rx="2" fill="#1e293b" stroke="#64748b" strokeWidth="1" />
                        <text x="83" y="127" fill="#94a3b8" fontSize="7" fontWeight="bold" textAnchor="middle">OPEN (0)</text>
                      </g>
                    )}
                  </g>
                )}
                <circle cx="135" cy="108" r="3.5" fill={isExt ? "#dc2626" : "#d97706"} />
                {/* REPOSITIONED CH2 TEXT LABEL NEAR RIGHT INSIDE EDGE (x=165) */}
                <text x="165" y="120" fill="#94a3b8" fontSize="8" fontWeight="bold" textAnchor="end">CH2</text>

                {/* 2NC Mechanical Linkage (Dashed line) */}
                <line x1="82" y1="66" x2="82" y2="101" stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="3,3" />
              </g>
            )}

            {/* CH1 Wire Path */}
            <path d={is1oo1 ? "M 135 90 L 450 90" : "M 135 73 L 450 73"} fill="none" stroke={fType === 'wire_break' && step >= 2 ? '#dc2626' : ch1Color} strokeWidth="2.5" />
            
            {/* LEFT-ALIGNED CH1 LABEL (x=185) TO PREVENT OVERLAP WITH FAULT DROP LINES (x=310) */}
            <text x="185" y={is1oo1 ? 82 : 65} fill={ch1Color} fontSize="8.5" fontWeight="bold" textAnchor="start">
              CH1 Loop ({isExt ? 'EXT 24V' : 'VS0'} → DI0)
            </text>

            {/* Animated Test Pulses Overlay on CH1 (if SCT ON) */}
            {isPulsing && step < 4 && fType !== 'wire_break' && (
              <path d={is1oo1 ? "M 135 90 L 450 90" : "M 135 73 L 450 73"} fill="none" stroke="#ffffff" strokeWidth="1.5" className="animated-wire-pulse" />
            )}

            {/* CH2 Wire Path */}
            {!is1oo1 && (
              <g>
                <path d="M 135 108 L 450 108" fill="none" stroke={ch2Color} strokeWidth="2.5" />
                {/* LEFT-ALIGNED CH2 LABEL (x=185) */}
                <text x="185" y="100" fill={ch2Color} fontSize="8.5" fontWeight="bold" textAnchor="start">
                  CH2 Loop ({isExt ? 'EXT 24V' : 'VS4'} → DI4)
                </text>
                {isPulsing && step < 4 && (
                  <path d="M 135 108 L 450 108" fill="none" stroke="#ffffff" strokeWidth="1.5" className="animated-wire-pulse" />
                )}
              </g>
            )}

            {/* NON-OVERLAPPING VISUAL FAULT OVERLAYS INJECTED AT STEP >= 2 */}
            {faultHighlight && (
              <g id="visual-fault-overlay">
                
                {/* 1. Short to L+ (+24V) */}
                {(fType === 'short_Lplus' || fType === 'short_other') && (
                  <g>
                    <path d="M 310 12 L 310 73" fill="none" stroke="#dc2626" strokeWidth="2.5" strokeDasharray="4,2" />
                    <circle cx="310" cy="12" r="3.5" fill="#dc2626" />
                    <circle cx="310" cy={is1oo1 ? 90 : 73} r="7" fill="#dc2626" opacity="0.4" className="animate-ping" style={{ transformOrigin: 'center', transformBox: 'fill-box' }} />
                    <circle cx="310" cy={is1oo1 ? 90 : 73} r="5" fill="#dc2626" />
                    <rect x="270" y="22" width="80" height="14" rx="3" fill="#121418" stroke="#dc2626" strokeWidth="1" />
                    <text x="310" y="32" fill="#fca5a5" fontSize="7.5" fontWeight="bold" textAnchor="middle">⚡ SHORT TO L+</text>
                  </g>
                )}

                {/* 2. Short to M (Ground) */}
                {fType === 'short_M' && (
                  <g>
                    <path d="M 310 172 L 310 73" fill="none" stroke="#00a8cc" strokeWidth="2.5" strokeDasharray="4,2" />
                    <circle cx="310" cy="172" r="3.5" fill="#00a8cc" />
                    <circle cx="310" cy={is1oo1 ? 90 : 73} r="7" fill="#00a8cc" opacity="0.4" className="animate-ping" style={{ transformOrigin: 'center', transformBox: 'fill-box' }} />
                    <circle cx="310" cy={is1oo1 ? 90 : 73} r="5" fill="#00a8cc" />
                    <rect x="270" y="148" width="80" height="14" rx="3" fill="#121418" stroke="#00a8cc" strokeWidth="1" />
                    <text x="310" y="158" fill="#38bdf8" fontSize="7.5" fontWeight="bold" textAnchor="middle">⚡ SHORT TO M (0V)</text>
                  </g>
                )}

                {/* 3. Short within Channel Pair */}
                {fType === 'short_pair' && !is1oo1 && (
                  <g>
                    <path d="M 390 73 L 390 108" fill="none" stroke="#d97706" strokeWidth="2.5" strokeDasharray="4,2" />
                    <circle cx="390" cy="90.5" r="7" fill="#d97706" opacity="0.4" className="animate-ping" style={{ transformOrigin: 'center', transformBox: 'fill-box' }} />
                    <circle cx="390" cy="73" r="4" fill="#d97706" />
                    <circle cx="390" cy="108" r="4" fill="#d97706" />
                    <rect x="335" y="83" width="105" height="15" rx="3" fill="#121418" stroke="#d97706" strokeWidth="1" />
                    <text x="387" y="94" fill="#fbbf24" fontSize="7.5" fontWeight="bold" textAnchor="middle">⚡ CH1 short to CH2</text>
                  </g>
                )}

                {/* 4. Short to VSn (L+) (REQUIREMENT 1 FIX: Bottom node at x=155, y=26 top-right of switch shape) */}
                {fType === 'short_vsn_Lplus' && (
                  <g>
                    <path d="M 155 12 L 155 26" fill="none" stroke="#dc2626" strokeWidth="2.5" strokeDasharray="4,2" />
                    <circle cx="155" cy="12" r="3.5" fill="#dc2626" />
                    <circle cx="155" cy="26" r="7" fill="#dc2626" opacity="0.4" className="animate-ping" style={{ transformOrigin: 'center', transformBox: 'fill-box' }} />
                    <circle cx="155" cy="26" r="4" fill="#dc2626" />
                    <rect x="115" y="30" width="80" height="14" rx="3" fill="#121418" stroke="#dc2626" strokeWidth="1" />
                    <text x="155" y="40" fill="#fca5a5" fontSize="7.5" fontWeight="bold" textAnchor="middle">⚡ VSn SHORT TO L+</text>
                  </g>
                )}

                {/* 5. Short to VSn (M / Ground) */}
                {fType === 'short_vsn_M' && (
                  <g>
                    <path d="M 155 172 L 155 148" fill="none" stroke="#00a8cc" strokeWidth="2.5" strokeDasharray="4,2" />
                    <circle cx="155" cy="172" r="3.5" fill="#00a8cc" />
                    <circle cx="155" cy="148" r="7" fill="#00a8cc" opacity="0.4" className="animate-ping" style={{ transformOrigin: 'center', transformBox: 'fill-box' }} />
                    <circle cx="155" cy="148" r="4" fill="#00a8cc" />
                    <rect x="115" y="148" width="80" height="14" rx="3" fill="#121418" stroke="#00a8cc" strokeWidth="1" />
                    <text x="155" y="158" fill="#38bdf8" fontSize="7.5" fontWeight="bold" textAnchor="middle">⚡ VSn GND SHORT</text>
                  </g>
                )}

                {/* 6. Wire Break */}
                {fType === 'wire_break' && (
                  <g>
                    <circle cx="310" cy={is1oo1 ? 90 : 73} r="8" fill="#dc2626" />
                    <text x="310" y={is1oo1 ? 93 : 76} fill="#ffffff" fontSize="8" fontWeight="bold" textAnchor="middle">✕</text>
                    <rect x="270" y={is1oo1 ? 60 : 45} width="80" height="14" rx="3" fill="#121418" stroke="#dc2626" strokeWidth="1" />
                    <text x="310" y={is1oo1 ? 70 : 55} fill="#fca5a5" fontSize="7.5" fontWeight="bold" textAnchor="middle">⚡ BREAK (∞ Ω)</text>
                  </g>
                )}

                {/* 7. Discrepancy Error */}
                {fType === 'discrepancy' && (
                  <g>
                    <rect x="305" y="83" width="125" height="15" rx="3" fill="#121418" stroke="#f59e0b" strokeWidth="1" />
                    <text x="367" y="94" fill="#fbbf24" fontSize="7.5" fontWeight="bold" textAnchor="middle">⏱ CONTACT MISMATCH (1/0)</text>
                  </g>
                )}

              </g>
            )}

            {/* ET 200SP Module Box */}
            <rect x="450" y="25" width="250" height="130" rx="6" fill="#0f172a" stroke="#00a8cc" strokeWidth="2" />
            <text x="575" y="42" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">ET 200SP F-DI Module</text>

            {/* CH1 Terminals */}
            <circle cx="450" cy={is1oo1 ? 90 : 73} r="4.5" fill={passivated ? "#64748b" : "#00a8cc"} />
            <text x="462" y={is1oo1 ? 93 : 76} fill="#e2e8f0" fontSize="8.5" fontWeight="bold" fontFamily="JetBrains Mono">
              1 : DI 0 {isExt ? '(EXT 24V)' : '& 9 : VS 0'} [CH1]
            </text>

            {/* CH2 Terminals */}
            {!is1oo1 && (
              <g>
                <circle cx="450" cy="108" r="4.5" fill={passivated ? "#64748b" : "#00a8cc"} />
                <text x="462" y="111" fill="#e2e8f0" fontSize="8.5" fontWeight="bold" fontFamily="JetBrains Mono">
                  5 : DI 4 {isExt ? '(EXT 24V)' : '& 13 : VS 4'} [CH2]
                </text>
              </g>
            )}

            {/* VS0/VS4 Terminals (if !isExt) */}
            {!isExt && (
              <g>
                <circle cx="450" cy="130" r="4.5" fill="#d97706" />
                <text x="462" y="133" fill="#e2e8f0" fontSize="8.5" fontWeight="bold" fontFamily="JetBrains Mono">
                  9 : VS 0 (Internal Supply)
                </text>
              </g>
            )}

            {/* DIAG LED */}
            <circle cx="682" cy="38" r="4" fill={diagLed} className={step === 4 ? "animate-pulse" : ""} />
            <text x="672" y="41" fill="#94a3b8" fontSize="7.5" textAnchor="end">DIAG</text>

            {/* Passivation Safe State Banner */}
            {passivated && (
              <g>
                <rect x="465" y="52" width="220" height="75" rx="4" fill="#dc2626" opacity="0.95" />
                <text x="575" y="74" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">FAIL-SAFE 0V FORCED</text>
                <text x="575" y="90" fill="#ffffff" fontSize="8.5" textAnchor="middle">SAFE STATE ACTIVE</text>
                <text x="575" y="104" fill="#fca5a5" fontSize="7.5" textAnchor="middle">
                  {is1oo1 ? 'CH1 PASSIVATED' : 'CHANNELS PASSIVATED'}
                </text>
              </g>
            )}
          </svg>
        </div>
      );
    };

    // OVERHAULED SIMULATION MODAL TOOL WITH RESET ON ENTRY FIX
    const SimulationModal = ({ appKey, supplyMode, fault, appTitle, onClose }) => {
      const cfg = APP_DATA[appKey];
      
      // Modal-local state for Power Supply, Short-Circuit Test, and Step
      const [modalSupplyMode, setModalSupplyMode] = useState(supplyMode);
      const [sctEnabled, setSctEnabled] = useState(supplyMode !== 'external');
      const [simStep, setSimStep] = useState(1);

      // RESET STEP TO 1 EVERY TIME A FAULT IS OPENED OR RE-ENTERED
      useEffect(() => {
        if (fault) {
          setSimStep(1);
          setModalSupplyMode(supplyMode);
          setSctEnabled(supplyMode !== 'external');
        }
      }, [fault, supplyMode]);

      if (!fault) return null;

      // Handle power supply toggle inside modal
      const handleModalSupplyToggle = (newMode) => {
        if (!cfg.allowExt && newMode === 'external') return;
        setModalSupplyMode(newMode);
        if (newMode === 'external') {
          setSctEnabled(false); // External supply forces SCT OFF
        } else {
          setSctEnabled(true);
        }
      };

      const isModalExt = modalSupplyMode === 'external';

      // Evaluate fault detection status dynamically based on current modal supply & SCT settings
      let rawStatus = isModalExt ? fault.ext : (sctEnabled ? fault.intOn : fault.intOff);
      const faultDetected = rawStatus.startsWith('Yes');

      const steps = [
        {
          num: 1,
          title: "1. Normal Operating State",
          diagLed: "GREEN",
          chLed: "GREEN",
          chVal: isModalExt ? "24V DC (External Supply OK)" : sctEnabled ? "24V DC (Internal VSn + Test Pulses ON)" : "24V DC (Internal VSn Static)",
          processVal: "1 (Valid Process Value)",
          outState: "Safety Actuators ENERGIZED (Machine Active)",
          desc: `CH1 (DI0) and CH2 (DI4) receive normal 24V supply voltages from ${isModalExt ? 'External 24V DC' : 'Internal VSn outputs'}. ${sctEnabled ? 'The PLC actively generates sub-millisecond test pulses (<1ms) on VSn to monitor wire integrity.' : 'Static 24V DC is supplied without test off-pulses.'} The Safety PLC reads valid process signal 1 and permits machine motion.`
        },
        {
          num: 2,
          title: "2. Electrical Fault Injected on Wiring",
          diagLed: "GREEN",
          chLed: "AMBER_WARNING",
          chVal: "Electrical Potential Mismatch / Short Circuit",
          processVal: "Signal Fault Injected",
          outState: "Safety Actuators ENERGIZED (Pending Diagnostic Cycle)",
          desc: `Fault event occurs: ${fault.cause}. Electrical potential on the field line shifts due to wire pinching, insulation failure, or physical bridge.`
        },
        {
          num: 3,
          title: "3. PLC Diagnostic Scan & Detection",
          diagLed: faultDetected ? "FLASHING_RED" : "GREEN",
          chLed: faultDetected ? "RED_ERROR" : "GREEN",
          chVal: faultDetected ? "Pulse Corruption / Discrepancy Mismatch" : "Undetected Signal Override",
          processVal: faultDetected ? "Passivation In Progress" : "1 (Unfiltered Corrupted Signal)",
          outState: faultDetected ? "Safety Actuators TRIPPING (Output Relays / Contactors De-energizing)" : "Safety Actuators ENERGIZED (Undetected in Idle State)",
          desc: faultDetected
            ? `DIAGNOSTIC DETECTED: ${fault.consequence}. ${sctEnabled ? 'Active test pulses detect missing off-window or pulse crosstalk.' : 'Channel mismatch triggers discrepancy timer.'}`
            : `UNDETECTED IN IDLE STATE: With Short-Circuit Test DISABLED, the PLC does not generate test pulses. The short circuit remains undetected until switch actuation (demand) or discrepancy occurs.`
        },
        {
          num: 4,
          title: "4. Passivation & Safe State Outcome",
          diagLed: faultDetected ? "FLASHING_RED" : "GREEN",
          chLed: faultDetected ? "RED_ERROR" : "GREEN",
          chVal: faultDetected ? "0V DC Forced (Channels Passivated)" : "24V Overridden (Pending Demand)",
          processVal: faultDetected ? "0 (Substituted Safe Value)" : "1 (Unpassivated)",
          outState: faultDetected ? "Safety Actuators DE-ENERGIZED (STO Active / Motion Halted)" : "Safety Actuators ENERGIZED (Demand-Based Passivation Pending)",
          desc: faultDetected
            ? `SAFETY OUTCOME: ${fault.safetyOutcome} Affected channels are passivated. Process value 0 is forced in the PII image, de-energizing output relays/contactors and safely halting machine motion.`
            : `DEMAND-BASED OUTCOME: As per Table 4-7/4-9, this fault condition is not detected during static idle state with SCT OFF. Passivation will only trigger upon physical switch demand when discrepancy timer expires.`
        }
      ];

      const cur = steps[simStep - 1];

      return (
        <div className="fixed inset-0 z-[100] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4">
          <div className="bg-white border-2 border-slate-700 rounded-xl shadow-2xl max-w-6xl lg:max-w-7xl w-full max-h-[96vh] overflow-hidden flex flex-col animate-in fade-in zoom-in-95 duration-150">
            
            {/* Modal Header Bar with Dual Toggles */}
            <div className="bg-[#121418] text-white px-4 py-2.5 border-b border-slate-800 flex justify-between items-center flex-wrap gap-2 flex-shrink-0">
              <div className="flex items-center gap-2">
                <TerminalIcon className="w-4 h-4 text-ak-cyan" />
                <h3 className="font-bold text-sm sm:text-base tracking-wide">// PLC SAFETY FAULT SIMULATOR</h3>
              </div>

              {/* DUAL TOGGLE CONTROL BAR: POWER SUPPLY + SCT */}
              <div className="flex items-center gap-3">
                {/* Power Supply Toggle */}
                <div className="flex items-center gap-1.5 bg-slate-900 px-2.5 py-1 rounded border border-slate-700">
                  <span className="text-slate-400 font-mono text-[11px] font-bold">POWER:</span>
                  <button
                    disabled={!cfg.allowExt}
                    onClick={() => handleModalSupplyToggle(modalSupplyMode === 'internal' ? 'external' : 'internal')}
                    className={`px-2 py-0.5 rounded text-[11px] font-bold font-mono transition-all ${
                      !cfg.allowExt
                        ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'
                        : modalSupplyMode === 'internal'
                        ? 'bg-amber-600 text-white shadow-sm'
                        : 'bg-red-600 text-white shadow-sm'
                    }`}
                  >
                    {!cfg.allowExt ? 'INTERNAL ONLY' : modalSupplyMode === 'internal' ? 'INTERNAL (VSn)' : 'EXTERNAL (24V)'}
                  </button>
                </div>

                {/* Short-Circuit Test Toggle */}
                <div className="flex items-center gap-1.5 bg-slate-900 px-2.5 py-1 rounded border border-slate-700">
                  <span className="text-slate-400 font-mono text-[11px] font-bold">SCT:</span>
                  <button
                    disabled={isModalExt}
                    onClick={() => setSctEnabled(!sctEnabled)}
                    className={`px-2 py-0.5 rounded text-[11px] font-bold font-mono transition-all ${
                      isModalExt
                        ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'
                        : sctEnabled
                        ? 'bg-emerald-600 text-white shadow-sm'
                        : 'bg-rose-600 text-white shadow-sm'
                    }`}
                  >
                    {isModalExt ? 'DISABLED (EXT 24V)' : sctEnabled ? 'ENABLED (ON)' : 'DISABLED (OFF)'}
                  </button>
                </div>
              </div>

              <button 
                onClick={onClose}
                className="text-slate-400 hover:text-white font-mono text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 transition-colors"
              >
                ✕ CLOSE
              </button>
            </div>

            {/* STACKED VERTICAL CONTENT BODY */}
            <div className="p-3 sm:p-4 flex flex-col gap-2.5 bg-slate-50 overflow-y-auto custom-scrollbar flex-1 min-h-0">
              
              {/* Fault Info Header Card */}
              <div className="bg-white p-2.5 sm:p-3 rounded-lg border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-2 flex-shrink-0">
                <div>
                  <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-0.5">{appTitle}</span>
                  <strong className="text-slate-900 font-extrabold text-sm sm:text-base block">{fault.name}</strong>
                </div>

                {/* SIEMENS DIAGNOSTIC HEX CODE BADGE */}
                <div className="bg-slate-900 text-white px-3 py-1 rounded border border-slate-700 font-mono text-xs flex items-center gap-2">
                  <div>
                    <span className="text-slate-400 text-[9px] block uppercase font-bold">PLC Diagnostic Code</span>
                    <strong className="text-ak-cyan font-bold text-xs block">{fault.diagCode}</strong>
                  </div>
                  <span className="text-slate-300 text-[10px] italic border-l border-slate-700 pl-2">{fault.diagMsg}</span>
                </div>
              </div>

              {/* LIVE DYNAMIC CHANNEL WIRING SCHEMATIC DIAGRAM */}
              <div className="flex-shrink-0">
                <SimulationChannelDiagram 
                  appKey={appKey} 
                  modalSupplyMode={modalSupplyMode} 
                  fault={fault} 
                  step={simStep} 
                  sctEnabled={sctEnabled} 
                />
              </div>

              {/* Step Navigation Bar */}
              <div className="grid grid-cols-4 gap-2 flex-shrink-0">
                {steps.map((s) => (
                  <button
                    key={s.num}
                    onClick={() => setSimStep(s.num)}
                    className={`p-1.5 sm:p-2 rounded text-center text-xs font-bold border transition-all ${
                      simStep === s.num
                        ? 'bg-slate-900 text-white border-slate-900 shadow-sm'
                        : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                    }`}
                  >
                    Step {s.num}
                  </button>
                ))}
              </div>

              {/* Simulation Dashboard Panel */}
              <div className="bg-[#121418] rounded-xl p-3 text-white border border-slate-800 flex flex-col gap-2 flex-shrink-0">
                <div className="flex justify-between items-center border-b border-slate-800 pb-1.5">
                  <span className="font-mono font-bold text-white text-xs uppercase tracking-wide">
                    {cur.title}
                  </span>
                  <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300">
                    STEP {simStep}/4
                  </span>
                </div>

                {/* Status Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 my-0.5 text-xs">
                  <div className="bg-slate-800/90 p-2 rounded border border-slate-700">
                    <span className="text-slate-400 text-[10px] block font-mono">DIAG LED</span>
                    <span className={`font-bold block mt-0.5 text-xs ${cur.diagLed === 'GREEN' ? 'text-emerald-400' : 'text-rose-400 animate-pulse'}`}>
                      ● {cur.diagLed}
                    </span>
                  </div>
                  <div className="bg-slate-800/90 p-2 rounded border border-slate-700">
                    <span className="text-slate-400 text-[10px] block font-mono">CHANNEL LED</span>
                    <span className={`font-bold block mt-0.5 text-xs ${cur.chLed === 'GREEN' ? 'text-emerald-400' : cur.chLed === 'AMBER_WARNING' ? 'text-amber-400' : 'text-rose-500'}`}>
                      ● {cur.chLed}
                    </span>
                  </div>
                  <div className="bg-slate-800/90 p-2 rounded border border-slate-700">
                    <span className="text-slate-400 text-[10px] block font-mono">PROCESS VALUE (PII)</span>
                    <strong className="text-white block mt-0.5 text-xs">{cur.processVal}</strong>
                  </div>
                  <div className="bg-slate-800/90 p-2 rounded border border-slate-700">
                    <span className="text-slate-400 text-[10px] block font-mono">CHANNEL VOLTAGE</span>
                    <strong className="text-amber-300 block mt-0.5 text-xs leading-snug">{cur.chVal}</strong>
                  </div>
                </div>

                {/* Safety Output Status Bar */}
                <div className="bg-slate-900 p-2 rounded-lg border border-slate-700">
                  <span className="text-slate-400 text-[10px] block font-bold mb-0.5">// SAFETY ACTUATOR REACTION</span>
                  <p className={`font-bold text-xs ${simStep === 4 && faultDetected ? 'text-rose-400 font-extrabold' : simStep === 3 && faultDetected ? 'text-amber-300' : 'text-emerald-400'}`}>
                    ► {cur.outState}
                  </p>
                </div>

                {/* Detailed Narrative */}
                <p className="text-xs text-slate-300 leading-relaxed bg-slate-800/60 p-2.5 rounded border border-slate-700">
                  {cur.desc}
                </p>
              </div>

            </div>

            {/* Footer Control Buttons */}
            <div className="bg-white p-3 border-t border-slate-200 flex justify-between items-center flex-shrink-0">
              <button
                disabled={simStep === 1}
                onClick={() => setSimStep(s => Math.max(1, s - 1))}
                className="px-3.5 py-1.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs disabled:opacity-40 transition-all"
              >
                ← Previous
              </button>

              <div className="flex gap-2">
                <button
                  onClick={() => setSimStep(1)}
                  className="px-3 py-1.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-all"
                >
                  Reset
                </button>
                {simStep < 4 ? (
                  <button
                    onClick={() => setSimStep(s => Math.min(4, s + 1))}
                    className="px-4 py-1.5 rounded bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs transition-all flex items-center gap-1"
                  >
                    Next Step →
                  </button>
                ) : (
                  <button
                    onClick={onClose}
                    className="px-4 py-1.5 rounded bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs transition-all"
                  >
                    Finish Simulation
                  </button>
                )}
              </div>
            </div>

          </div>
        </div>
      );
    };

    // Main Application Component
    const App = () => {
      const [appKey, setAppKey] = useState('app31');
      const [supplyMode, setSupplyMode] = useState('internal');
      const [animate, setAnimate] = useState(true);
      const [simulatedFault, setSimulatedFault] = useState(null);

      const cfg = APP_DATA[appKey];
      const dynamicSctRule = getSctRuleText(appKey, supplyMode);

      // Dynamic Sensor Supply text matching selected mode
      const displaySensorSupplyText = appKey === 'appMat' 
        ? 'VSn Dedicated Internal' 
        : (supplyMode === 'internal' ? 'VSn Internal' : 'External 24V');

      const handleSupplyChange = (mode) => {
        if (!cfg.allowExt && mode === 'external') return;
        setSupplyMode(mode);
      };

      const handleAppChange = (key) => {
        setAppKey(key);
        if (!APP_DATA[key].allowExt && supplyMode === 'external') {
          setSupplyMode('internal');
        }
      };

      const handleOpenSimulation = (fault) => {
        setSimulatedFault(fault);
      };

      return (
        <div className="min-h-screen bg-slate-200/80 p-2 sm:p-3 md:p-3 flex justify-center items-start">
          
          {/* Centered Bounded View Container */}
          <div className="w-full max-w-[1580px] bg-[#fdfdfd] border-2 border-slate-300 rounded-xl shadow-xl overflow-hidden flex flex-col">
            
            {/* Header Bar */}
            <header className="bg-[#121418] border-b border-[#1a1d24] px-5 py-2 flex justify-between items-center text-xs text-slate-400 shadow-md w-full flex-shrink-0">
              <div className="flex items-center gap-2.5">
                <BuildingIcon className="w-4 h-4 text-slate-300" />
                <span className="font-bold text-white tracking-wide">Labtech Engineering Co. Ltd.</span>
                <span className="text-slate-600">|</span>
                <span className="text-slate-400 font-mono">Thailand</span>
              </div>
              <div className="flex items-center gap-4">
                <span className="bg-[#1a1d24] text-white border border-slate-700 px-2.5 py-0.5 rounded font-mono text-xs font-bold flex items-center gap-1.5">
                  <ShieldCheckIcon className="w-3.5 h-3.5 text-slate-300" />
                  MSC // ASSISTANT
                </span>
                <span className="text-slate-400 flex items-center gap-1.5">
                  <UserIcon className="w-3.5 h-3.5 text-slate-400" />
                  Dev: <strong className="text-white font-bold">Kemuel Avenido</strong>
                </span>
              </div>
            </header>

            {/* Title Bar */}
            <div className="bg-[#1a1d24] border-b border-[#2d3242] px-5 py-3 w-full text-white shadow-sm flex-shrink-0">
              <div className="w-full flex flex-wrap justify-between items-center gap-4">
                <div>
                  <h1 className="text-xl sm:text-2xl font-black text-white tracking-tight flex items-center gap-3">
                    <span>//</span> Fail-Safe Digital Input F-DI 8x24VDC HF
                    <DeviceTag code="6ES7136-6BA01-0CA0" />
                  </h1>
                  <p className="text-xs sm:text-sm text-slate-300 mt-0.5">
                    Siemens ET 200SP Safety Application Selector & Verified Fault Detection Reference
                  </p>
                </div>

                {/* Manual Link */}
                <a
                  href={GDRIVE_MANUAL_URL}
                  target="_blank"
                  rel="noopener noreferrer"
                  title="Click to open Google Drive User Manual"
                  className="text-xs sm:text-sm font-mono font-bold bg-[#121418] text-white hover:text-ak-cyan hover:border-ak-cyan px-3.5 py-1.5 rounded border border-slate-700 flex items-center gap-2 transition-all shadow-sm group"
                >
                  <BookOpenIcon className="w-4 h-4 text-slate-300 group-hover:scale-110 transition-transform" />
                  REF: {cfg.section}
                  <ExternalLinkIcon className="w-3.5 h-3.5 opacity-70 group-hover:opacity-100" />
                </a>
              </div>
            </div>

            {/* Main Content Layout */}
            <main className="flex-1 w-full p-4 sm:p-5 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
              
              {/* Left Column */}
              <div className="lg:col-span-7 flex flex-col gap-4">
                
                {/* Controls */}
                <AkPanel className="p-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
                    <div>
                      <label className="text-xs sm:text-sm font-bold uppercase tracking-wider text-slate-900 block mb-1.5 flex items-center gap-1.5">
                        <SlidersIcon className="w-4 h-4 text-slate-800" />
                        Safety Application Mode (Section 4.3)
                      </label>
                      <select
                        value={appKey}
                        onChange={(e) => handleAppChange(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm font-semibold rounded-lg p-2.5 focus:border-ak-cyan focus:outline-none"
                      >
                        {Object.values(APP_DATA).map(item => (
                          <option key={item.id} value={item.id}>{item.title}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-xs sm:text-sm font-bold uppercase tracking-wider text-slate-900 block mb-1.5 flex items-center gap-1.5">
                        <ZapIcon className="w-4 h-4 text-amber-600" />
                        Sensor Power Supply Mode
                      </label>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => handleSupplyChange('internal')}
                          className={`py-2 text-xs sm:text-sm font-bold uppercase tracking-wider rounded-lg border transition-all flex items-center justify-center gap-1.5 ${
                            supplyMode === 'internal'
                              ? 'bg-slate-900 text-white border-slate-900 shadow-md'
                              : 'bg-slate-50 text-slate-700 border-slate-300 hover:text-slate-900 hover:bg-slate-100'
                          }`}
                        >
                          <ZapIcon className="w-4 h-4" />
                          Internal (VSn)
                        </button>
                        <button
                          disabled={!cfg.allowExt}
                          onClick={() => handleSupplyChange('external')}
                          className={`py-2 text-xs sm:text-sm font-bold uppercase tracking-wider rounded-lg border transition-all flex items-center justify-center gap-1.5 ${
                            supplyMode === 'external'
                              ? 'bg-slate-900 text-white border-slate-900 shadow-md'
                              : !cfg.allowExt
                              ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed opacity-50'
                              : 'bg-slate-50 text-slate-700 border-slate-300 hover:text-slate-900 hover:bg-slate-100'
                          }`}
                        >
                          <ZapIcon className="w-4 h-4" />
                          External 24V
                        </button>
                      </div>
                    </div>
                  </div>
                </AkPanel>

                {/* Info Cards Grid (3 Cards) */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  
                  {/* Card 1: Safety Rating */}
                  <AkPanel className="p-3 text-center flex flex-col items-center justify-center">
                    <div className="flex items-center justify-center gap-1 mb-1">
                      <span className="text-[11px] font-bold text-slate-700 uppercase tracking-wider block text-center">Safety Rating</span>
                      <ShieldCheckIcon className="w-3.5 h-3.5 text-slate-800" />
                    </div>
                    <strong className="text-sm sm:text-base font-extrabold text-slate-900 block text-center">{cfg.safety}</strong>
                  </AkPanel>
                  
                  {/* Card 2: Evaluation */}
                  <div className="relative group/infoCard h-full">
                    <AkPanel className="p-3 text-center flex flex-col items-center justify-center h-full cursor-help hover:border-ak-cyan">
                      <div className="flex items-center justify-center gap-1 mb-1">
                        <span className="text-[11px] font-bold text-slate-700 uppercase tracking-wider block text-center">Evaluation</span>
                        <InfoIcon className="w-3.5 h-3.5 text-slate-800" />
                      </div>
                      <strong className="text-xs sm:text-sm font-bold text-slate-900 block text-center">{cfg.eval}</strong>
                    </AkPanel>

                    <div className="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-80 p-3.5 bg-[#121418] text-white rounded-lg border border-slate-700 shadow-xl opacity-0 invisible group-hover/infoCard:opacity-100 group-hover/infoCard:visible transition-all duration-200 z-[100] pointer-events-none text-xs">
                      <div className="flex items-center justify-between mb-1.5 border-b border-slate-700 pb-1">
                        <span className="font-mono font-bold text-slate-200 text-xs flex items-center gap-1.5">
                          <LayersIcon className="w-3.5 h-3.5 text-ak-cyan" />
                          // MOON ARCHITECTURE
                        </span>
                        <span className="text-[10px] text-slate-400 font-mono">ISO 13849-1</span>
                      </div>
                      <p className="text-slate-300 text-xs leading-relaxed mb-2 text-left">
                        {cfg.evalTooltip}
                      </p>
                      <div className="bg-slate-800 p-2 rounded border border-slate-700 text-xs text-slate-300 text-left">
                        <strong className="text-white font-semibold block mb-0.5">What "MooN" Means:</strong>
                        "M out of N" channels must function correctly to maintain safety operation.
                      </div>
                    </div>
                  </div>

                  {/* Card 3: Short-Circuit Test (SCT) */}
                  <div className="relative group/scRule h-full">
                    <AkPanel className="p-3 text-center flex flex-col items-center justify-center h-full cursor-help hover:border-ak-cyan">
                      <div className="flex items-center justify-center gap-1 mb-0.5">
                        <span className="text-[11px] font-bold text-slate-700 uppercase tracking-wider block text-center">Short-Circuit Test (SCT)</span>
                        <InfoIcon className="w-3.5 h-3.5 text-slate-800" />
                      </div>
                      <strong className="text-xs font-extrabold block text-center leading-tight text-[#C00000]">
                        {dynamicSctRule}
                      </strong>
                    </AkPanel>

                    <div className="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-80 p-3.5 bg-[#121418] text-white rounded-lg border border-slate-700 shadow-xl opacity-0 invisible group-hover/scRule:opacity-100 group-hover/scRule:visible transition-all duration-200 z-[100] pointer-events-none text-xs">
                      <div className="flex items-center justify-between mb-1.5 border-b border-slate-700 pb-1">
                        <span className="font-mono font-bold text-slate-200 text-xs flex items-center gap-1.5">
                          <TerminalIcon className="w-3.5 h-3.5 text-ak-cyan" />
                          // SHORT-CIRCUIT TEST (SCT)
                        </span>
                        <span className="text-[10px] text-slate-400 font-mono">EN 61131-2</span>
                      </div>
                      <p className="text-slate-300 text-xs leading-relaxed mb-2 text-left">
                        {cfg.scTooltip}
                      </p>
                      <div className="bg-slate-800 p-2 rounded border border-slate-700 text-xs text-slate-300 text-left">
                        <strong className="text-white font-semibold block mb-0.5 flex items-center gap-1">
                          <ZapIcon className="w-3 h-3 text-ak-cyan" />
                          How it works:
                        </strong>
                        The PLC briefly turns off 24V supply outputs (&lt;1ms) to verify signal pulses without crosstalk.
                      </div>
                    </div>
                  </div>

                </div>

                {/* Mandatory Manual Condition Card */}
                <div className="relative group/warnCard">
                  <AkPanel className="p-3.5 bg-amber-50/90 border-amber-300 text-amber-950 text-sm flex items-start gap-3 cursor-help">
                    <AlertTriangleIcon className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                    <div className="flex-1">
                      <div className="flex items-center justify-between flex-wrap gap-2 mb-1">
                        <strong className="text-xs sm:text-sm uppercase tracking-wide text-amber-900 font-bold">
                          Mandatory Manual Condition ({cfg.section})
                        </strong>
                        <span className="w-5 h-5 rounded-full bg-amber-200/90 text-amber-900 border border-amber-400 flex items-center justify-center font-bold text-xs shadow-sm cursor-help hover:bg-amber-300">
                          ?
                        </span>
                      </div>
                      <span className="text-xs sm:text-sm leading-relaxed block">{cfg.warning}</span>
                    </div>
                  </AkPanel>

                  {/* HOVER-ON POPUP OVERLAY */}
                  <div className="absolute left-0 bottom-full mb-2 w-full p-4 bg-[#121418] text-white rounded-lg border border-amber-400 shadow-2xl opacity-0 invisible group-hover/warnCard:opacity-100 group-hover/warnCard:visible transition-all duration-200 z-[100] pointer-events-none text-xs">
                    <div className="flex items-center justify-between border-b border-slate-700 pb-2 mb-2.5">
                      <span className="font-mono font-bold text-amber-400 text-xs flex items-center gap-2">
                        <AlertTriangleIcon className="w-4 h-4 text-amber-400" />
                        // MANDATORY SAFETY REQUIREMENTS BREAKDOWN
                      </span>
                      <span className="text-[10px] font-mono text-amber-300 bg-amber-950/80 px-2 py-0.5 rounded border border-amber-700">
                        {cfg.section}
                      </span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                      {cfg.subWarnings && cfg.subWarnings.map((sub, sIdx) => (
                        <div key={sIdx} className="bg-slate-800/90 p-2.5 rounded border border-slate-700 text-left">
                          <strong className="text-amber-300 font-bold block mb-1 text-[11px]">// {sub.title}</strong>
                          <p className="text-slate-300 leading-normal text-[11px]">{sub.text}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Vector SVG Wiring Diagram Panel */}
                <AkPanel className="p-4 flex flex-col gap-3">
                  <div className="flex justify-between items-center flex-wrap gap-2">
                    <div className="flex items-center gap-2">
                      <ActivityIcon className="w-4 h-4 text-slate-800" />
                      <span className="text-sm font-bold text-slate-900">Schematic Wiring Diagram</span>
                      <span className="text-xs font-mono bg-slate-100 text-slate-800 px-2.5 py-0.5 rounded border border-slate-300 font-bold">
                        {supplyMode === 'internal' ? cfg.figInt : cfg.figExt}
                      </span>
                    </div>
                    
                    {/* Signal Flow Toggle Buttons */}
                    <button
                      onClick={() => setAnimate(!animate)}
                      className="flex items-center gap-2 text-xs font-bold text-slate-700 hover:text-slate-900 bg-slate-100 px-2.5 py-1 rounded-md border border-slate-300 transition-all"
                    >
                      <span className={`w-2 h-2 rounded-full ${animate ? 'bg-emerald-600 animate-pulse' : 'bg-slate-400'}`}></span>
                      {animate ? 'Signal Flow Active' : 'Signal Flow Static'}
                    </button>
                  </div>

                  <div className="flex items-center justify-center w-full">
                    <SvgWiringDiagram appKey={appKey} supplyMode={supplyMode} animate={animate} />
                  </div>

                  {/* Wire Legend */}
                  <div className="flex flex-wrap gap-4 text-xs font-medium text-slate-700 pt-2 border-t border-slate-200">
                    <span className="flex items-center gap-1.5">
                      <span className="w-3.5 h-1.5 bg-sky-600 rounded-full"></span> F-DI Channel Inputs (DI)
                    </span>
                    <span className="flex items-center gap-1.5">
                      <span className="w-3.5 h-1.5 bg-amber-600 rounded-full"></span> Internal VSn Supply (Test Pulses)
                    </span>
                    <span className="flex items-center gap-1.5">
                      <span className="w-3.5 h-1.5 bg-red-600 rounded-full"></span> External +24V DC Supply
                    </span>
                  </div>
                </AkPanel>

              </div>

              {/* Right Column */}
              <div className="lg:col-span-5 flex flex-col gap-4">

                {/* STEP 7 Hardware Configuration Summary Panel */}
                <AkPanel className="p-4">
                  <div className="text-xs sm:text-sm font-bold text-slate-900 uppercase tracking-wider mb-2.5 flex justify-between items-center">
                    <span className="flex items-center gap-2">
                      <CpuIcon className="w-4 h-4 text-slate-800" />
                      TIA Portal Hardware Configuration
                    </span>
                    <span className="text-xs text-slate-900 bg-slate-100 px-2.5 py-0.5 rounded font-mono border border-slate-300 font-bold">F-DI Parameters</span>
                  </div>
                  <div className="grid grid-cols-3 gap-2 text-xs">
                    <div className="bg-slate-50 p-2 rounded-lg border border-slate-200">
                      <span className="text-slate-500 block font-semibold text-[11px]">Sensor Evaluation</span>
                      <strong className="text-slate-900 text-xs leading-snug block mt-0.5 font-bold">{cfg.params.eval}</strong>
                    </div>
                    <div className="bg-slate-50 p-2 rounded-lg border border-slate-200">
                      <span className="text-slate-500 block font-semibold text-[11px]">Sensor Supply</span>
                      <strong className="text-slate-900 text-xs leading-snug block mt-0.5 font-bold">{displaySensorSupplyText}</strong>
                    </div>
                    <div className="bg-slate-50 p-2 rounded-lg border border-slate-200">
                      <span className="text-slate-500 block font-semibold text-[11px]">Short-Circuit Test</span>
                      <strong className="text-slate-900 text-xs leading-snug block mt-0.5 font-bold">{dynamicSctRule}</strong>
                    </div>
                  </div>
                </AkPanel>

                {/* Diagnostic Fault Detection Matrix Table */}
                <AkPanel className="p-4 flex flex-col">
                  <div className="flex justify-between items-center mb-2.5">
                    <div className="flex items-center gap-2">
                      <TerminalIcon className="w-4 h-4 text-slate-800" />
                      <div>
                        <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">
                          Diagnostic Fault Detection Matrix
                        </h3>
                        <p className="text-[11px] text-slate-500">Verified according to Siemens Manual {cfg.tableRef}</p>
                      </div>
                    </div>
                    
                    <a
                      href={GDRIVE_MANUAL_URL}
                      target="_blank"
                      rel="noopener noreferrer"
                      title={`Click to open ${cfg.tableRef} in Google Drive User Manual`}
                      className="text-xs font-mono font-bold bg-emerald-50 text-emerald-800 hover:bg-emerald-100 hover:border-emerald-400 px-2.5 py-1 rounded border border-emerald-300 flex items-center gap-1 transition-all group shadow-sm"
                    >
                      <span>{cfg.tableRef} (p. {cfg.tablePage})</span>
                      <ExternalLinkIcon className="w-3 h-3 text-emerald-700 group-hover:scale-110 transition-transform" />
                    </a>
                  </div>

                  {/* Fault Table with Unclipped Hover Popups */}
                  <div className="overflow-visible border border-slate-200 rounded-lg">
                    <table className="w-full text-xs text-left border-collapse">
                      <thead>
                        <tr className="bg-slate-100 text-slate-800 border-b border-slate-300 font-bold uppercase text-[11px]">
                          <th className="p-2.5 w-[38%]">Fault Description</th>
                          <th className="p-2 text-center w-[18%]">Int VSn (SCT ON)</th>
                          <th className="p-2 text-center w-[18%]">Int VSn (SCT OFF)</th>
                          <th className="p-2 text-center w-[14%]">Ext 24V</th>
                          <th className="p-2 text-center w-[12%]">Simulate</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 bg-white">
                        {cfg.faults.map((f, i) => {
                          const isTopRow = i < 3;
                          return (
                            <tr 
                              key={i} 
                              className="hover:bg-slate-100/80 transition-colors group/faultRow relative"
                            >
                              <td className="p-2.5 font-semibold text-slate-900 leading-snug">
                                <div className="flex items-center justify-between gap-1 relative group/infoIcon">
                                  <span>{f.name}</span>
                                  <InfoIcon className="w-3.5 h-3.5 text-slate-500 group-hover/infoIcon:text-slate-900 cursor-help flex-shrink-0" />

                                  {/* UNCLIPPED HOVER POPUP TOOLTIP */}
                                  <div className={`absolute left-0 ${isTopRow ? 'top-full mt-2' : 'bottom-full mb-2'} w-80 sm:w-96 p-4 bg-[#121418] text-white rounded-lg border border-slate-700 shadow-2xl opacity-0 invisible group-hover/infoIcon:opacity-100 group-hover/infoIcon:visible transition-all duration-200 z-[100] pointer-events-none text-xs`}>
                                    <div className="flex items-center justify-between border-b border-slate-700 pb-1.5 mb-2">
                                      <span className="font-mono font-bold text-white text-xs flex items-center gap-1.5">
                                        <TerminalIcon className="w-3.5 h-3.5 text-ak-cyan" />
                                        // FAULT DIAGNOSTIC ANALYSIS
                                      </span>
                                      <span className="text-[10px] font-mono text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-800 font-bold">
                                        CODE: {f.diagCode}
                                      </span>
                                    </div>
                                    
                                    <div className="flex flex-col gap-2 text-left">
                                      <p className="text-slate-200 leading-relaxed">
                                        <strong className="text-amber-400 font-bold block mb-0.5">Target Fault:</strong>
                                        {f.name}
                                      </p>
                                      <p className="text-slate-300 leading-relaxed">
                                        <strong className="text-amber-300 font-bold block mb-0.5">Possible Root Cause:</strong>
                                        {f.cause}
                                      </p>
                                      <p className="text-slate-300 leading-relaxed">
                                        <strong className="text-sky-300 font-bold block mb-0.5">Diagnostic Message:</strong>
                                        {f.diagMsg} ({f.consequence})
                                      </p>
                                      <div className="bg-slate-900 p-2.5 rounded border border-slate-700">
                                        <strong className="text-emerald-400 font-bold block mb-0.5">Safety Function Outcome:</strong>
                                        <span className="text-slate-200">{f.safetyOutcome}</span>
                                      </div>
                                      <div className="bg-slate-800/90 p-2.5 rounded border border-slate-700">
                                        <strong className="text-purple-300 font-bold block mb-0.5">Real-World Industrial Example:</strong>
                                        <span className="text-slate-300">{f.example}</span>
                                      </div>
                                    </div>
                                  </div>

                                </div>
                              </td>
                              <td className="p-1.5 text-center">
                                <StatusBadge value={f.intOn} />
                              </td>
                              <td className="p-1.5 text-center">
                                <StatusBadge value={f.intOff} />
                              </td>
                              <td className="p-1.5 text-center">
                                <StatusBadge value={f.ext} />
                              </td>
                              <td className="p-1.5 text-center">
                                <button
                                  onClick={() => handleOpenSimulation(f)}
                                  className="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-white rounded font-mono font-bold text-[10px] tracking-wider transition-all flex items-center justify-center gap-1 mx-auto shadow-sm"
                                  title="Run step-by-step PLC Safety Simulation"
                                >
                                  <PlayIcon className="w-2.5 h-2.5 text-ak-cyan" />
                                  Sim
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  <p className="text-[11px] text-slate-500 italic mt-2.5 pt-2 border-t border-slate-200 leading-relaxed">
                    Hover over any fault description row or info icon to inspect root causes, PLC responses, and safety outcomes. Click "Sim" to run an interactive step-by-step PLC fault evaluation simulator.
                  </p>
                </AkPanel>

              </div>

            </main>
          </div>

          {/* OVERHAULED SIMULATION MODAL TOOL */}
          <SimulationModal 
            appKey={appKey}
            supplyMode={supplyMode}
            fault={simulatedFault} 
            appTitle={cfg.title} 
            onClose={() => setSimulatedFault(null)} 
          />

        </div>
      );
    };

    // Status Pill Component
    const StatusBadge = ({ value }) => {
      if (value.startsWith('Yes')) {
        return (
          <span className="inline-flex items-center justify-center gap-0.5 px-1.5 py-0.5 text-[11px] font-bold text-emerald-900 bg-emerald-100 border border-emerald-300 rounded">
            <CheckCircleIcon className="w-3 h-3 text-emerald-700" />
            {value}
          </span>
        );
      }
      if (value.startsWith('No')) {
        return (
          <span className="inline-flex items-center justify-center gap-0.5 px-1.5 py-0.5 text-[11px] font-bold text-rose-900 bg-rose-100 border border-rose-300 rounded">
            <XCircleIcon className="w-3 h-3 text-rose-700" />
            {value}
          </span>
        );
      }
      return (
        <span className="inline-flex items-center justify-center gap-0.5 px-1.5 py-0.5 text-[11px] font-medium text-slate-600 bg-slate-100 rounded">
          <MinusCircleIcon className="w-3 h-3 text-slate-400" />
          {value}
        </span>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
